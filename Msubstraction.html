<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>matrice substraction</title>
        <style>
            .text {
                font-family: cursive;
                color: rgb(226, 43, 171);
                font-size: x-large;
            }
            #titleDiv {
                width: 75% !important;
                margin: auto;
                margin-top: 20px;
            }
            .headerDiv {
                text-align: center;
                width: 100%;
                border: 2px rgb(226, 43, 171) solid;
                border-radius: 30px;
                box-shadow: 0 0 5px  rgb(226, 43, 171);
                margin-top: 20px;
            }
            .tbl {
                border: 3px solid rgb(226, 43, 171);
                border-collapse: collapse;
                margin: auto;
                padding: 40px;
                font-size:x-large;
                color: rgb(226, 43, 171);
            }
            #mainDiv {
                display: flex;
                margin-top: 40px;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <div class="headerDiv" id="titleDiv">
            <p class="text">
                MATRICE OPERATION LIBRARY
            </p>
        </div>
        <div id="mainDiv">
            <table class="tbl">
                <tr class="tbl">
                    <td class="tbl">10</td>
                    <td class="tbl">20</td>
                </tr>
                <tr class="tbl">
                    <td class="tbl">30</td>
                    <td class="tbl">40</td>
                </tr>
            </table>
            <p class="text">_</p>
            <table class="tbl">
                <tr class="tbl">
                    <td class="tbl">5</td>
                    <td class="tbl">10</td>
                </tr>
                <tr class="tbl">
                    <td class="tbl">15</td>
                    <td class="tbl">20</td>
                </tr>
            </table>
            <p class="text">=</p>
            <table class="tbl">
                <tr class="tbl">
                    <td class="tbl">5</td>
                    <td class="tbl">10</td>
                </tr>
                <tr class="tbl">
                    <td class="tbl">15</td>
                    <td class="tbl">20</td>
                </tr>
            </table>
        </div>   
    </body>
</html>
