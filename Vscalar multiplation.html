<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>vector addition</title>
        <style>
            .text {
                font-family: cursive;
                color: rgb(226, 43, 171);
                font-size: x-large;
            }
            #titleDiv {
                width: 75% !important;
                margin: auto;
                margin-top: 20px;
            }
            .headerDiv {
                text-align: center;
                width: 100%;
                border: 2px rgb(226, 43, 171) solid;
                border-radius: 30px;
                box-shadow: 0 0 5px  rgb(226, 43, 171);
                margin-top: 20px;
            }
            #mainDiv {
                display: flex;
                margin-top: 40px;
                align-items: center;
                text-align: center;
                width: 100%;
            }
            .tbl {
                margin: auto;
                padding: 40px;
                color: rgb(226, 43, 171);
            }
            .miniText {
                font-size: 60px;
            }
        </style>
    </head>
    <body>
        <div class="headerDiv" id="titleDiv">
            <p class="text">
                VECTOR OPERATION LIBRARY
            </p>
        </div>
        <div id="mainDiv">
            <div class="tbl">
                <p class="text miniText">3.5</p>
            </div>
            <div class="tbl">
                <p class="text miniText">*</p>
            </div>
            <div class="tbl">
                <p class="text miniText">(2,4,6)</p>
            </div>
            <div class="tbl">
                <p class="text miniText">=</p>
            </div>
            <div class="tbl">
                <p class="text miniText">(7,14,21)</p>
            </div>
        </div>
    </body>
</html>
